<!DOCTYPE html>
<html>
    <head>
        <title>İNTERACTİVE-COLOR-SİTE</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="logo.png" type="image/x-icon">
    </head>
    <body>
    <h1>Hello World,run away quickly because I've started!</h1>
    <p>Not my absolute first web site,but a trial page featuring an interactive button.</p>
        <button id="button">Press the button</button>
        <audio id="bg-music" src="music.mp3" loop></audio>
    <script>
    let button = document.getElementById("button");
    let music = document.getElementById("bg-music");
     button.addEventListener("click", function() {
            let RandomRenk = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
            document.body.style.backgroundColor = RandomRenk;
            button.innerHTML = "Awesome, press again!";
            music.volume = 1.0;
            music.play();
     });
    </script>

    </body>
</html>
